name: Build OpenWrt x86_64 BIOS

# 只做手动触发：这套固件依赖 local-packages/ 里的两个现成插件包，
# 包没到位之前不应该自己跑起来；而且自动构建会把 runner 时间烧光。
#
# 密钥纪律：订阅链接、API token 一律走 GitHub Secrets 在构建期注入，
# 不要提交进 seed.config 或 files/。

on:
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: "OpenWrt 分支或 tag"
        required: true
        default: "openwrt-25.12"
        type: choice
        options:
          - openwrt-25.12
          - v25.12.6
          - v25.12.0
          - master
      jobs:
        description: "make -j（runner 4 核 16G，3 比较稳）"
        required: false
        default: "3"
        type: string

env:
  DEBIAN_FRONTEND: noninteractive
  OPENWRT_REF: ${{ inputs.openwrt_ref }}
  JOBS: ${{ inputs.jobs }}
  COLLECT_ARTIFACTS: "1"

concurrency:
  group: openwrt-ninja-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build firmware (x86_64 / legacy BIOS / squashfs+gzip)
    runs-on: ubuntu-24.04
    # GitHub 的免费 runner 单 job 上限就是 6 小时，写更大也会被掐
    timeout-minutes: 360

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/microsoft/msbuild || true
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        # 取 OpenWrt 官方 Ubuntu 依赖清单，另加 libelf-dev/gettext/ccache/subversion
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang bison flex g++-multilib gcc-multilib git \
            libncurses5-dev libssl-dev libelf-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget gettext ccache subversion
          sudo apt-get clean

      - name: Restore OpenWrt download dir and ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/openwrt-dl
            ~/openwrt-ccache
          key: openwrt-${{ inputs.openwrt_ref }}-${{ hashFiles('seed.config', 'package/**/Makefile', 'build.sh') }}
          restore-keys: |
            openwrt-${{ inputs.openwrt_ref }}-

      - name: Wire cache into the build
        run: |
          mkdir -p ~/openwrt-dl ~/openwrt-ccache
          echo "OPENWRT_DL_DIR=$HOME/openwrt-dl" >> "$GITHUB_ENV"
          echo "OPENWRT_CCACHE_DIR=$HOME/openwrt-ccache" >> "$GITHUB_ENV"

      # build.sh 会一次做完：预检本地插件包 -> clone 源码 -> 注入 feed -> 写 .config
      # 和 overlay -> make defconfig -> 逐条断言符号 -> make -> 验收预置包已进镜像
      - name: Build firmware
        run: bash build.sh --build

      - name: Report image info
        if: always()
        run: |
          ls -la artifacts/ || true
          [ -f artifacts/IMAGES.sha256 ] && cat artifacts/IMAGES.sha256 || true

      - name: Upload firmware, logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-ninja-x86_64-${{ github.run_number }}
          path: |
            artifacts/**
            openwrt/bin/targets/x86/64/*.img.gz
            openwrt/bin/targets/x86/64/*.manifest
            openwrt/bin/targets/x86/64/*.buildinfo
          if-no-files-found: warn
          retention-days: 14
